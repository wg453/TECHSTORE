<html>
<meta charset="UTF-8">

<section>

    <h2>Регистрация</h2>

    <form action="/register" method="post">

        <label for="username">Имя</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Введите имя"
            required
        >

        <br><br>

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Введите email"
            required
        >

        <br><br>

        <label for="password">Пароль</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <label for="message">Сообщение</label>

        <br>

        <textarea
            id="message"
            name="message"
            placeholder="Введите сообщение"
        ></textarea>

        <br><br>

        <h3>Способ доставки</h3>

        <input
            type="radio"
            id="courier"
            name="delivery"
            value="courier"
        >

        <label for="courier">Курьер</label>

        <br>

        <input
            type="radio"
            id="pickup"
            name="delivery"
            value="pickup"
        >

        <label for="pickup">Самовывоз</label>

        <br><br>

        <label for="country">Страна</label>

        <select id="country" name="country">

            <option value="kz" selected>
                Казахстан
            </option>

            <option value="ru">
                Россия
            </option>

            <option value="us">
                США
            </option>

        </select>

        <br><br>

        <input
            type="checkbox"
            id="agreement"
            name="agreement"
        >

        <label for="agreement">
            Я согласен с условиями
        </label>

        <br><br>

        <button type="submit">
            Зарегистрироваться
        </button>

    </form>

</section>

</html>
