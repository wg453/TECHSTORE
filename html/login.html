<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
    </head>
        <body"body-register">
            <p class="register-heading">Вход</p>
            
            <div class="register-container">
    
                <form class="form-register" action="/login" method="post">

                    <div>
                        <label for="login">Логин:</label>
                        <input  class="register-input" type="text" id="login" placeholder="Логин" name="username" required>
                    </div>
                    <div>
                        <label for="password">Пароль:</label>
                        <input  class="register-input" type="password" id="password" placeholder="Пароль" name="key" required>
                    </div>

                    <div>
                        <label class="agreement" for="agreement">Я согласен с <a href="terms.html">условиями пользования </a></label>
                        <input  type="checkbox" id="agreement" name="agreement" value="yes" required>
                    </div>

                    <div>
                        <button class="button">Войти</button>
                    </div>


                </form>
            </div>
            <div>

                <a href="index.html">Войти</a>

            </div>
        </body>
</html>
